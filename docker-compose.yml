name: bigip-mgt-mfa   # compose project name → volumes are prefixed bigip-mgt-mfa_ (not the dir name)
services:
  dns:
    # Why a DNS server is part of this stack: the BIG-IP's APM OAuth client resolves the
    # Keycloak FQDN through a TMOS dns-resolver, which does its own lookups in TMM and does
    # NOT read the BIG-IP's /etc/hosts. So a hosts-file fallback can cover the browser but
    # can never cover the BIG-IP. Rather than make the demo depend on a DNS server you may
    # not be allowed to edit (UDF, a customer lab), bigip-mgt-mfa brings its own: CoreDNS is
    # authoritative for the demo zone and forwards everything else upstream.
    # Point the BIG-IP resolver here; optionally point your workstation here too and the
    # hosts-file step disappears entirely.
    image: docker.io/coredns/coredns:1.12.0
    container_name: bigip-mgt-mfa-dns
    restart: unless-stopped
    command: -conf /etc/coredns/Corefile
    # Bound to the host's lab address rather than 0.0.0.0 on purpose: most Linux hosts
    # already run a stub resolver (systemd-resolved on 127.0.0.53), and binding the wildcard
    # collides with it. This is also the exact address the BIG-IP resolver is pointed at.
    ports:
      - "${MFA_HOST_IP}:${MFA_DNS_PORT:-53}:53/udp"
      - "${MFA_HOST_IP}:${MFA_DNS_PORT:-53}:53/tcp"
    volumes:
      - ./dns:/etc/coredns:ro

  openldap:
    # Only starts with the `bundled` profile (MFA_DIRECTORY_MODE=bundled, the default).
    # In external mode bigip-mgt-mfa talks to your AD/LDAP instead and this never runs:
    #   docker compose --profile bundled up -d   # bundled
    #   docker compose up -d                     # external — dns only
    profiles: ["bundled"]
    image: osixia/openldap:1.5.0
    container_name: openldap
    restart: unless-stopped
    hostname: openldap.${MFA_DOMAIN:-bigip-mgt-mfa.lab}
    ports: ["389:389", "636:636"]
    environment:
      LDAP_ORGANISATION: "${MFA_ORG:-bigip-mgt-mfa}"
      LDAP_DOMAIN: "${MFA_DOMAIN:-bigip-mgt-mfa.lab}"
      LDAP_ADMIN_PASSWORD: "${MFA_LDAP_ADMIN_PW}"
      LDAP_TLS: "true"
      LDAP_TLS_CRT_FILENAME: "ldap.crt"
      LDAP_TLS_KEY_FILENAME: "ldap.key"
      LDAP_TLS_CA_CRT_FILENAME: "ca.crt"
      LDAP_TLS_VERIFY_CLIENT: "never"
    volumes:
      # Its OWN directory, not the shared certs/: osixia chowns this at every start, and
      # sharing it would eventually make the other keys unreadable. NOT :ro.
      - ./ldap-certs:/container/service/slapd/assets/certs
      - ldapdata:/var/lib/ldap
      - ldapconf:/etc/ldap/slapd.d

volumes:
  ldapdata:
  ldapconf:
